entry:
  title: Stone Entry
  text:
    - "Cold air rises from the passage ahead."
    # The lantern line follows the item, so `look` after taking it does not
    # promise something that is no longer there.
    - if: { hasItem: entry_lantern }
      then: "A pale ring in the dust is all that marks where the lantern stood."
      else: "A brass lantern rests beside the threshold."
  items: [entry_lantern]
  exits:
    north: passage
passage:
  title: Narrow Passage
  text:
    - "The passage runs south to the stone entry."
    # A condition in `text` may carry `then` alone; a false branch prints nothing.
    - if: { var: lampLit }
      then: "Lantern light moves on the walls, and the way south is easy to read."
    - if: { hasItem: entry_lantern }
      then: "A stooped figure works a lamp along the far wall."
  # NPC instance ids, exactly as `items` holds item instance ids. The keeper is
  # here because `instances.npc.passage_keeper` places it here.
  npcs: [passage_keeper]
  exits:
    south: entry
  actions:
    - id: light_lantern
      label: Light the lantern
      if:
        and:
          - { hasItem: entry_lantern }
          - { var: lampLit, neq: true }
      then:
        - "The lantern catches. Warm light fills the passage."
        - { set: { lampLit: true } }
    # `npcSet` names its own instance, so it needs no context and one directive
    # could write several NPCs at once.
    - id: ask_keeper
      label: Ask the keeper about the lamps
      then:
        - call: keeper.asked
        - npcSet: { passage_keeper.trust: 3 }
        - { inc: { var: npc.passage_keeper.lampsLit, by: 1 } }
    # `npcVar` reads the same store, so trust seeded from the NPC's `state:`
    # block gates this without anyone naming a flat state key.
    - id: ask_which_lamp
      label: Ask which lamp is broken
      if:
        npcVar: passage_keeper.trust
        gte: 3
      then:
        - call: keeper.which_lamp
