# Who each NPC is. An NPC is not present anywhere until an `instances.npc` entry
# places it, exactly as an item definition needs an instance to be lying somewhere.
#
# The name is a name, with no leading article: presence-driven offers the player
# "Talk to <name>", and a definite article in front of it reads as a bug in a
# sentence the author has to write by hand.
keeper:
  name: Rowan
  description: Rowan tends the lamps along the passage, and has done for a long time.
  # Inkforge never draws this. The key records which asset belongs to the NPC, so
  # a canvas scene or a UI element can reference one name instead of a path.
  portrait: assets/portraits/keeper.svg
  # Authored metadata, read from Lua through `GameNPCs` and never mutated.
  role: lampkeeper
  lamps: 7
  # Default values seeded into the state of every instance of this NPC, under
  # `npc.<instance-id>.<path>`. Top-level `state` and a resumed save apply over
  # these, so a default is a starting point rather than a lock.
  state:
    trust: 2
    lampsLit: 0
