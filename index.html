<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inkforge Adventure Studio</title><meta name="description" content="Author, test, pack and load YAML and Lua text adventures in the browser."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310111a'/%3E%3Cpath d='M17 47 28 16h8l11 31h-7l-2-7H26l-2 7zM28 34h8l-4-12z' fill='%23ffbe55'/%3E%3C/svg%3E"><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
  <header><div class="brand"><span class="mark">A</span><div><strong>INKFORGE</strong><small>Adventure Studio</small></div></div><nav><button class="nav active" data-view="play">Play</button><button class="nav" data-view="author">Author</button></nav><div class="project-title"><span>SCENARIO</span><strong id="title"></strong><i id="saved"></i></div><div class="actions"><button class="gold" id="saveBtn">Save</button><button id="restartHero">Restart</button><button id="savesBtn">Manage Saves</button><button id="loadBtn">Scenarios</button></div><input id="saveFile" type="file" accept=".json,application/json" hidden><input id="importFile" type="file" accept=".inkforge" hidden><input id="assetInput" type="file" accept=".svg,.png,.jpg,.jpeg,.webp,.mp3,.ogg,.wav" multiple hidden></header>
  <section class="play-view" id="playView">
    <div class="rail" id="toolRail" aria-label="Tools"></div><main class="story-stage"><div class="scene-head"><div><h1 id="storyTitle"></h1></div></div><div id="heroTerminal" class="hero-terminal" aria-live="polite"></div><div id="uiOutput" class="ui-output"></div><section class="decision" id="decision"><div><b>ACTIONS</b><span id="choiceCount"></span></div><div id="heroChoices" class="hero-choices"></div><form id="heroCommand"><span>›</span><input id="heroInput" autocomplete="off" placeholder="Type a command..."><button>Send</button></form></section></main><aside class="canvas-panel"><div class="surface-head" id="surfaceHeader"></div><div class="canvas-stage" id="gameSurface"></div><div class="player-strip" id="gameHud"></div></aside>
  </section>
  <section class="inventory-overlay hidden" id="inventoryOverlay" aria-label="Inventory" role="dialog" aria-modal="true"><div class="inventory-window"><header><div><span id="inventoryKicker"></span><h2 id="inventoryTitle"></h2></div><button id="closeInventory">Close ×</button></header><div class="inventory-body"><section><div class="inventory-label"><span>ITEM SLOTS</span><b id="inventoryCount"></b></div><div id="inventorySlots" class="inventory-slots"></div></section><aside class="item-inspector"><div class="item-art" id="itemArt"></div><p class="eyebrow" id="itemKicker"></p><h3 id="itemName"></h3><div id="itemDescription" class="item-description"></div><div id="itemActions" class="item-actions"></div></aside></div></div></section><section class="inventory-overlay hidden" id="projectOverlay" aria-label="Scenarios" role="dialog" aria-modal="true"><div class="inventory-window project-window manager-window"><header><div><span>SCENARIO LIBRARY</span><h2>Scenarios</h2></div><button id="closeProjects">Close ×</button></header><div class="project-list" id="projectList"></div><div class="manager-actions"><button id="newBtn">New scenario</button><button id="importBtn">Import Scenario</button><button id="exportBtn">Export Scenario</button></div></div></section><section class="inventory-overlay hidden" id="saveOverlay" aria-label="Saves" role="dialog" aria-modal="true"><div class="inventory-window project-window manager-window"><header><div><span>SAVED GAMES</span><h2>Manage saves</h2></div><button id="closeSaves">Close ×</button></header><div class="project-list" id="saveList"></div><div class="manager-actions"><button id="importSaveBtn">Import save</button></div></div></section><div id="modalHost"></div><div id="linkGuardHost"></div>
  <section class="workspace hidden" id="authorView">
    <aside class="author-sidebar"><div class="explorer"><div class="pane-head"><span>SCENARIO FILES</span><button id="addFile" title="Add asset">+</button></div><div class="tree"></div></div><a class="docs-card" href="https://svaltek.github.io/inkforge/docs/" target="_blank" rel="noopener noreferrer" aria-label="Open Inkforge documentation in a new tab"><span class="docs-card-mark" aria-hidden="true">?</span><span class="docs-card-copy"><strong>Inkforge docs</strong><small>Guides and reference</small></span><span class="docs-card-arrow" aria-hidden="true">↗</span></a></aside>
    <section class="editor"><div class="tabs"><button class="tab active" data-file="scenario.yaml">scenario.yaml <i>×</i></button><button class="tab" data-file="scripts/main.lua">main.lua <i>×</i></button><span class="format" id="format">YAML</span></div><div class="editor-wrap"><div id="code"></div></div><div id="assetPreview" class="asset-preview hidden"></div><footer><span id="cursor">Ln 1, Col 1</span><span id="diagnostics">● Valid scenario</span><span>UTF-8</span></footer></section>
    <aside class="runtime"><div class="runtime-head"><div><span>PLAYTEST</span><strong id="runTitle"></strong></div><div><button class="run" id="run">▶ Run</button></div></div><div class="status"><span class="dot"></span><span id="location"></span></div><div class="terminal" id="terminal" aria-live="polite"></div><div id="choices" class="choices"></div><form id="commandForm"><span>›</span><input id="command" autocomplete="off" placeholder="Type a command"><button>Send</button></form><div class="events"><div class="event-head"><span>EVENT STREAM</span><button id="clearEvents">Clear</button></div><div id="eventLog"></div></div></aside>
  </section>
  <span id="luaStatus" hidden>Wasmoon ready on demand</span>
</main><script type="module" src="assets/main.js"></script></body></html>
